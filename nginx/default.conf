server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    root         /usr/share/nginx/html;

    # Relative Location-Header, damit Umleitungen hinter Traefik (TLS) https und den Host behalten.
    absolute_redirect off;
    log_not_found     off;
    charset           utf-8;
    charset_types     text/css text/plain application/json;

    # Canonical ohne Schrägstrich (HANDOFF): /cve-2026-111497 liefert direkt 200 aus
    # cve-2026-111497/index.html, die Form mit Schrägstrich leitet per 301 dorthin um.
    location ~ ^(/.+)/$ {
        include /etc/nginx/snippets/security-headers.conf;
        return 301 $1$is_args$args;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/index.html =404;
    }

    # style.css hat keinen Hash im Namen: 1 Tag statt "immutable", damit CSS-Änderungen ankommen.
    location = /style.css {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Kein Favicon im Design: leere Antwort statt 404.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
