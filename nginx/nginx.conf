user  nginx;
worker_processes  auto;
# warn statt notice: keine Client-IPs aus 404-Meldungen (dazu log_not_found off in default.conf).
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Zugriffslog ohne IP-Adresse und ohne Referrer.
    log_format  noip  '[$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log  /var/log/nginx/access.log  noip;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied    any;
    gzip_types      text/css text/plain application/json application/ld+json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
